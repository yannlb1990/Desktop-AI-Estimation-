<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#000000"/>
      <stop offset="100%" style="stop-color:#1F150C"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#E1DCC9"/>
      <stop offset="100%" style="stop-color:#412D15"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Subtle grid lines -->
  <g stroke="#412D15" stroke-width="1" opacity="0.3">
    <line x1="0" y1="105" x2="1200" y2="105"/>
    <line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="315" x2="1200" y2="315"/>
    <line x1="0" y1="420" x2="1200" y2="420"/>
    <line x1="0" y1="525" x2="1200" y2="525"/>
    <line x1="150" y1="0" x2="150" y2="630"/>
    <line x1="300" y1="0" x2="300" y2="630"/>
    <line x1="450" y1="0" x2="450" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="750" y1="0" x2="750" y2="630"/>
    <line x1="900" y1="0" x2="900" y2="630"/>
    <line x1="1050" y1="0" x2="1050" y2="630"/>
  </g>

  <!-- Accent bar -->
  <rect x="80" y="200" width="6" height="100" fill="url(#accent)" rx="3"/>

  <!-- Logo mark -->
  <rect x="80" y="120" width="48" height="48" rx="10" fill="#412D15" opacity="0.4"/>
  <rect x="84" y="124" width="40" height="40" rx="8" fill="none" stroke="#E1DCC9" stroke-width="2" opacity="0.6"/>
  <text x="104" y="151" font-family="Arial, sans-serif" font-size="22" font-weight="900" fill="#E1DCC9" text-anchor="middle">M</text>

  <!-- Company name -->
  <text x="144" y="153" font-family="Arial Black, Arial, sans-serif" font-size="32" font-weight="900" fill="#E1DCC9" letter-spacing="1">Metricore</text>

  <!-- Main headline -->
  <text x="80" y="280" font-family="Arial Black, Arial, sans-serif" font-size="56" font-weight="900" fill="#E1DCC9" letter-spacing="-1">From Plans to Tenders</text>
  <text x="80" y="348" font-family="Arial Black, Arial, sans-serif" font-size="56" font-weight="900" fill="url(#accent)" letter-spacing="-1">in Minutes.</text>

  <!-- Subtext -->
  <text x="80" y="420" font-family="Arial, sans-serif" font-size="24" fill="#E1DCC9" opacity="0.5">AI-powered estimation for Australian builders · NCC compliant · 26 trades</text>

  <!-- Stats row -->
  <rect x="80" y="470" width="160" height="70" rx="10" fill="#1F150C" stroke="#412D15" stroke-width="1"/>
  <text x="160" y="503" font-family="Arial Black, Arial, sans-serif" font-size="28" font-weight="900" fill="#E1DCC9" text-anchor="middle">10×</text>
  <text x="160" y="527" font-family="Arial, sans-serif" font-size="14" fill="#E1DCC9" opacity="0.4" text-anchor="middle">Faster</text>

  <rect x="260" y="470" width="160" height="70" rx="10" fill="#1F150C" stroke="#412D15" stroke-width="1"/>
  <text x="340" y="503" font-family="Arial Black, Arial, sans-serif" font-size="28" font-weight="900" fill="#E1DCC9" text-anchor="middle">26</text>
  <text x="340" y="527" font-family="Arial, sans-serif" font-size="14" fill="#E1DCC9" opacity="0.4" text-anchor="middle">Trades</text>

  <rect x="440" y="470" width="160" height="70" rx="10" fill="#1F150C" stroke="#412D15" stroke-width="1"/>
  <text x="520" y="503" font-family="Arial Black, Arial, sans-serif" font-size="28" font-weight="900" fill="#E1DCC9" text-anchor="middle">NCC</text>
  <text x="520" y="527" font-family="Arial, sans-serif" font-size="14" fill="#E1DCC9" opacity="0.4" text-anchor="middle">Compliant</text>

  <!-- Right side decoration -->
  <rect x="820" y="150" width="300" height="200" rx="16" fill="#1F150C" stroke="#412D15" stroke-width="1" opacity="0.8"/>
  <rect x="836" y="166" width="268" height="12" rx="4" fill="#412D15" opacity="0.6"/>
  <rect x="836" y="186" width="200" height="8" rx="4" fill="#E1DCC9" opacity="0.3"/>
  <rect x="836" y="202" width="240" height="8" rx="4" fill="#412D15" opacity="0.4"/>
  <rect x="836" y="218" width="180" height="8" rx="4" fill="#412D15" opacity="0.4"/>
  <rect x="836" y="250" width="268" height="60" rx="8" fill="#000000" stroke="#412D15" stroke-width="1"/>
  <rect x="848" y="262" width="80" height="8" rx="4" fill="#E1DCC9" opacity="0.5"/>
  <rect x="848" y="278" width="120" height="8" rx="4" fill="#412D15" opacity="0.4"/>
  <rect x="1040" y="262" width="40" height="36" rx="6" fill="#E1DCC9" opacity="0.7"/>

  <rect x="820" y="370" width="300" height="140" rx="16" fill="#1F150C" stroke="#412D15" stroke-width="1" opacity="0.6"/>
  <rect x="836" y="386" width="140" height="10" rx="4" fill="#412D15" opacity="0.5"/>
  <rect x="836" y="406" width="268" height="80" rx="8" fill="#000000"/>
  <rect x="848" y="418" width="60" height="8" rx="4" fill="#E1DCC9" opacity="0.4"/>
  <rect x="848" y="434" width="90" height="8" rx="4" fill="#412D15" opacity="0.4"/>
  <rect x="848" y="450" width="75" height="8" rx="4" fill="#412D15" opacity="0.4"/>

  <!-- Domain watermark -->
  <text x="1120" y="610" font-family="Arial, sans-serif" font-size="18" fill="#E1DCC9" opacity="0.3" text-anchor="end">metricore.com.au</text>
</svg>
